services:
  - type: web
    name: safetrax
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: DB_PATH
        value: /opt/render/project/src/database/safetrax.db
      - key: SCHEMA_PATH
        value: /opt/render/project/src/database/schema.sql
    autoDeploy: true
